<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDA — S.T.A.L.K.E.R. 2</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="zone-field" aria-hidden="true">
      <div class="zone-sky"></div>
      <div class="zone-haze"></div>
      <div class="zone-fog zone-fog-a"></div>
      <div class="zone-fog zone-fog-b"></div>
    </div>
    <div class="pda">
      <div class="pda-bezel">
        <span class="pda-screw-bl" aria-hidden="true"></span>
        <span class="pda-screw-br" aria-hidden="true"></span>
        <div class="pda-status">
          <span class="pda-signal-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="pda-carrier">ANOMALY NET</span>
          <span id="pda-signal">Signal</span>
          <span class="pda-status-sep" aria-hidden="true">·</span>
          <span class="pda-emission-status">
            <span class="pda-led" id="pda-led" aria-hidden="true"></span>
            <span id="pda-emission">Emission clear</span>
          </span>
          <div class="lang-switch" id="lang-switch" role="group" aria-labelledby="lang-label">
            <span class="visually-hidden" id="lang-label">Language</span>
            <button type="button" class="lang-opt" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" class="lang-opt" data-lang="ru" aria-pressed="false">RU</button>
          </div>
        </div>
        <div class="pda-screen">
          <div class="shell">
            <aside class="rail">
              <div class="rail-brand">
                <div class="brand-plate">
                  <div class="brand-badge" aria-hidden="true">
                    <img class="brand-badge-ico" src="assets/icons/radioactive.svg" alt="" width="28" height="28" />
                  </div>
                  <div class="brand-copy">
                    <div class="brand-game">S.T.A.L.K.E.R.&nbsp;2</div>
                    <div class="rail-title" id="app-title">Field log</div>
                  </div>
                </div>
                <div class="rail-unit" id="rail-unit">UNIT-07 · FIRMWARE 2.0</div>
              </div>
              <div class="rail-progress">
                <div class="rail-progress-label" id="progress-text"></div>
                <div
                  class="bar"
                  id="progress-bar"
                  role="progressbar"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                  aria-labelledby="progress-text"
                >
                  <span class="bar-fill" id="progress-fill"></span>
                </div>
                <div class="rail-missed" id="progress-missed" hidden></div>
              </div>
              <details class="rail-legend">
                <summary id="legend-label"></summary>
                <p class="rail-hint" id="legend"></p>
              </details>
              <div class="rail-actions">
                <button type="button" id="btn-export" class="ghost"></button>
                <button type="button" id="btn-import" class="ghost"></button>
                <button type="button" id="btn-reset" class="ghost danger"></button>
                <input type="file" id="file-import" accept="application/json,.json" hidden />
              </div>
              <p class="rail-credits" id="rail-credits"></p>
            </aside>

            <main class="main">
              <header class="toolbar">
                <div class="mode-switch" id="mode-switch" role="group" aria-labelledby="mode-label">
                  <span class="visually-hidden" id="mode-label">Catalog mode</span>
                  <button type="button" class="mode-opt" data-mode="side" aria-pressed="true">Side</button>
                  <button type="button" class="mode-opt" data-mode="story" aria-pressed="false">Story</button>
                </div>
                <div
                  class="campaign-switch"
                  id="campaign-switch"
                  role="group"
                  aria-labelledby="campaign-label"
                  hidden
                >
                  <span class="visually-hidden" id="campaign-label">Story campaign</span>
                  <button type="button" class="campaign-opt" data-campaign="base" aria-pressed="true">Base</button>
                  <button type="button" class="campaign-opt" data-campaign="coh" aria-pressed="false">Cost of Hope</button>
                  <button type="button" class="campaign-opt" data-campaign="all" aria-pressed="false">All</button>
                </div>
                <div
                  class="branch-switch"
                  id="branch-switch"
                  role="group"
                  aria-labelledby="branch-label"
                  hidden
                >
                  <span class="visually-hidden" id="branch-label">Story branch</span>
                  <button type="button" class="branch-opt" data-branch="all" aria-pressed="true">All</button>
                  <button type="button" class="branch-opt" data-branch="ward" data-branch-group="base" aria-pressed="false">Ward</button>
                  <button type="button" class="branch-opt" data-branch="spark" data-branch-group="base" aria-pressed="false">Spark</button>
                  <button type="button" class="branch-opt" data-branch="independent" data-branch-group="base" aria-pressed="false">Independent</button>
                  <button type="button" class="branch-opt" data-branch="duty" data-branch-group="coh" aria-pressed="false" hidden>Duty</button>
                  <button type="button" class="branch-opt" data-branch="freedom" data-branch-group="coh" aria-pressed="false" hidden>Freedom</button>
                </div>
                <input
                  type="search"
                  id="search"
                  class="search"
                  autocomplete="off"
                  enterkeyhint="search"
                />
                <div class="ms" id="filter-region"></div>
                <div class="ms" id="filter-type"></div>
                <div class="ms" id="filter-timing"></div>
                <div class="ms" id="filter-status"></div>
                <label class="sort-field">
                  <span class="visually-hidden" id="sort-label"></span>
                  <select id="sort"></select>
                </label>
              </header>
              <div class="chips" id="filter-chips" hidden></div>
              <div class="count" id="showing"></div>
              <section class="list" id="list"></section>
            </main>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
