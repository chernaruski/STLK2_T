<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDA — S.T.A.L.K.E.R. 2</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="pda">
      <div class="pda-bezel">
        <span class="pda-screw-bl" aria-hidden="true"></span>
        <span class="pda-screw-br" aria-hidden="true"></span>
        <div class="pda-status" aria-hidden="true">
          <span class="pda-led" id="pda-led"></span>
          <span id="pda-signal">Signal</span>
        </div>
        <div class="pda-screen">
          <div class="shell">
            <aside class="rail">
              <div class="rail-brand">
                <div class="rail-sig">PDA</div>
                <div class="rail-title" id="app-title">Field log</div>
                <div class="rail-sub" id="rail-sub">Zone · Journal</div>
              </div>
              <label class="field">
                <span id="lang-label">Language</span>
                <select id="lang"></select>
              </label>
              <div class="rail-progress">
                <div class="rail-progress-label" id="progress-text"></div>
                <div
                  class="bar"
                  id="progress-bar"
                  role="progressbar"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                  aria-labelledby="progress-text"
                >
                  <span class="bar-fill" id="progress-fill"></span>
                </div>
                <div class="rail-missed" id="progress-missed" hidden></div>
              </div>
              <details class="rail-legend">
                <summary id="legend-label"></summary>
                <p class="rail-hint" id="legend"></p>
              </details>
              <div class="rail-actions">
                <button type="button" id="btn-export" class="ghost"></button>
                <button type="button" id="btn-import" class="ghost"></button>
                <button type="button" id="btn-reset" class="ghost danger"></button>
                <input type="file" id="file-import" accept="application/json,.json" hidden />
              </div>
            </aside>

            <main class="main">
              <header class="toolbar">
                <input
                  type="search"
                  id="search"
                  class="search"
                  autocomplete="off"
                  enterkeyhint="search"
                />
                <div class="ms" id="filter-region"></div>
                <div class="ms" id="filter-type"></div>
                <div class="ms" id="filter-timing"></div>
                <div class="ms" id="filter-status"></div>
                <label class="sort-field">
                  <span class="visually-hidden" id="sort-label"></span>
                  <select id="sort"></select>
                </label>
              </header>
              <div class="chips" id="filter-chips" hidden></div>
              <div class="count" id="showing"></div>
              <section class="list" id="list"></section>
            </main>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
